
services:
  # ─── Metabase BI Dashboard ─────────────────────────────────────────────────
  # MySQL dijalankan manual via Laragon (host machine)
  metabase:
    image: metabase/metabase:latest
    container_name: health_metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      JAVA_TIMEZONE: Asia/Jakarta
    networks:
      - airflow
